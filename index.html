<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f9fd">
  <title>Bãi xe VinFast</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#edf3fb;color:#132338;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px;text-align:center}
    main{max-width:380px;padding:24px;border-radius:20px;background:#fff;box-shadow:0 12px 36px #13233816}
    .spinner{width:28px;height:28px;margin:0 auto 14px;border:3px solid #dce8f8;border-top-color:#0a60d8;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    a{color:#0a60d8;font-weight:700}
  </style>
</head>
<body>
  <main><div class="spinner" aria-hidden="true"></div><strong>Đang khôi phục ứng dụng bãi xe…</strong><p id="msg">Vui lòng đợi trong giây lát.</p></main>
  <script>
  (async function(){
    const source='https://raw.githubusercontent.com/trinhhoangthong7795-a11y/baixe34/8cdfb38caf026dad54c91c97ec501d451dfc6688/index.html';
    try{
      const response=await fetch(source,{cache:'no-store'});
      if(!response.ok)throw new Error('HTTP '+response.status);
      let html=await response.text();
      const mobileStyle=`<style>
        @media(max-width:900px){
          body{padding-bottom:calc(82px + env(safe-area-inset-bottom,0px))}
          .shell{display:block;min-height:100vh}
          .side{position:fixed!important;inset:auto 0 0!important;z-index:50!important;height:auto!important;display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px!important;overflow:visible!important;padding:7px 8px max(9px,env(safe-area-inset-bottom,0px))!important;background:rgba(255,255,255,.96)!important;backdrop-filter:blur(16px);box-shadow:0 -8px 26px rgba(17,35,60,.09);border:0!important;border-top:1px solid var(--line)!important}
          .side .sh{display:none!important}
          .side .nav{display:none!important}
          .side .nav[data-go="dashboard"],.side .nav[data-go="somap"],.side .nav[data-go="ton"],.side .nav[data-go="nhatky"]{display:flex!important;flex-direction:column;justify-content:center;gap:4px!important;width:100%!important;min-height:52px;padding:6px 3px!important;font-size:10px!important;white-space:normal!important;text-align:center;border-radius:13px}
          .side .nav svg{width:19px;height:19px}
          .main{padding-top:14px!important;padding-bottom:24px!important;padding-left:14px!important;padding-right:14px!important}
          .topbar{padding:10px 14px!important;gap:9px!important}
          .brand{width:auto!important;flex:0 1 auto!important}
          .brand b{max-width:145px;font-size:13px!important}
          .brand small,.gs kbd{display:none!important}
          .gs{flex:1 1 120px!important;max-width:none!important}
          .gs input{font-size:13px}
          .sync span{display:none!important}
          .fab-app{position:fixed;right:18px;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:55;width:56px;height:56px;border:0;border-radius:18px;background:linear-gradient(135deg,#0a60d8,#287df5);color:white;box-shadow:0 12px 26px rgba(10,96,216,.34);font-size:30px;font-weight:400;line-height:1}
          .card{padding:14px!important;border-radius:18px!important}
          .kpi{border-radius:16px!important}
          .report-page{margin:-14px -14px 0!important;padding:0 14px 24px!important}
        }
        @media(min-width:901px){.fab-app{display:none}}
      </style>`;
      if(html.includes('</head>'))html=html.replace('</head>',mobileStyle+'</head>');
      if(html.includes('<div id="ovRoot">'))html=html.replace('<div id="ovRoot">','<button class="fab-app" type="button" data-go="vao" aria-label="Nhập xe vào bãi">+</button><div id="ovRoot">');
      document.open();document.write(html);document.close();
    }catch(error){
      document.querySelector('#msg').innerHTML='Không tải được bản ứng dụng gốc. Hãy mở <a href="https://github.com/trinhhoangthong7795-a11y/baixe34/commit/8cdfb38caf026dad54c91c97ec501d451dfc6688">bản gốc trên GitHub</a> hoặc thử lại khi có mạng.';
      console.error('Unable to restore original app:',error);
    }
  })();
  </script>
</body>
</html>
