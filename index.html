<title>Quản Lý Bãi Xe VinFast</title>

<style>
/* Layout: thanh trên có ô tìm xe nhanh, menu trái trắng, vùng làm việc dạng bảng điều hành. Biển số dùng chữ mono như thẻ xe. */
:root{
  --bg:#f1f4f8;--surface:#ffffff;--surface2:#f6f8fb;--ink:#111a27;--muted:#5d6b7e;--line:#dde4ed;--line2:#c9d3e0;

  --wait:#f2b655;--wait-soft:#3b2b0e;--ok:#52d4a3;--ok-soft:#103a2c;--bad:#ff8087;--bad-soft:#44191d;--new:#b9a2ff;--new-soft:#2a2150;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b121c;--surface:#121c2b;--surface2:#172335;--ink:#e7edf6;--muted:#92a2b9;--line:#24344d;--line2:#33476a;
  --accent:#6ea3ff;--accent-ink:#071634;--accent-soft:#17315f;
  --wait:#f2b655;--wait-soft:#3b2b0e;--ok:#52d4a3;--ok-soft:#103a2c;--bad:#ff8087;--bad-soft:#44191d;--new:#b9a2ff;--new-soft:#2a2150;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);grid-template-rows:auto 1fr;min-height:100vh}
.topbar{grid-column:1/-1;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding-block:9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;width:208px;flex:none}
.logo{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 17px var(--fm);flex:none}
.brand b{display:block;font-size:14.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{color:var(--muted);font-size:11.5px}
.gs{position:relative;flex:1 1 280px;max-width:520px}
.gs input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--line2);border-radius:8px;background:var(--surface2)}
.gs svg{position:absolute;left:10px;top:9px;width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round}

.gres{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line2);border-radius:10px;box-shadow:0 14px 40px rgba(0,0,0,.2);max-height:60vh;overflow:auto;z-index:40}

.tright{margin-left:auto;display:flex;gap:8px;align-items:center}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}

.sync.warn i{background:var(--wait)}.sync.bad i{background:var(--bad)}
.side{background:var(--surface);border-right:1px solid var(--line);padding-block:14px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:57px;align-self:start;height:calc(100vh - 57px);overflow-y:auto}

.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;cursor:pointer;font-weight:500;color:var(--ink)}
.nav:hover{background:var(--surface2)}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.nav[aria-current="page"] .cnt{background:var(--surface);color:var(--accent)}
.main{min-width:0;padding-block:20px 56px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px))}
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 14px;margin-bottom:16px}
.ph h1{font-size:22px;font-weight:700;flex:1 1 240px}

.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:2px}
.seg button{border:0;background:none;padding:4px 12px;border-radius:6px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card>h3,.card .ch{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card .ch .more{margin-left:auto;font-size:12px;font-weight:600;color:var(--accent);background:none;border:0;cursor:pointer}
.grid{display:grid;gap:14px}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}.g3e{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 14px;text-align:left;cursor:pointer;min-width:0;box-shadow:var(--shadow)}
.kpi:hover{border-color:var(--accent)}
.kpi span{display:block;font-size:12px;color:var(--muted);font-weight:500}
.kpi b{display:block;font:600 30px/1.15 var(--fm);margin-top:2px;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted);font-size:11.5px}
.kpi.k-bad b{color:var(--bad)}.kpi.k-new b{color:var(--new)}.kpi.k-ok b{color:var(--ok)}.kpi.k-wait b{color:var(--wait)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}.pill.wait{background:var(--wait-soft);color:var(--wait);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}.pill.new{background:var(--new-soft);color:var(--new);border-color:transparent}.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.plate{display:inline-block;font:700 14px/1.2 var(--fm);letter-spacing:.04em;padding:1px 7px;border:1.5px solid var(--ink);border-radius:5px;background:var(--surface);white-space:nowrap}
.vin{display:inline-block;font:700 14px/1.2 var(--fm);letter-spacing:.08em;padding:1px 7px;border:1.5px dashed var(--new);color:var(--new);border-radius:5px;white-space:nowrap}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:720px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;padding:8px 11px;background:var(--surface2);border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
td{padding:8px 11px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}tbody tr.click:hover td{background:var(--surface2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:12.5px}.mono{font-family:var(--fm)}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.form .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted);min-width:0}
label.f em{color:var(--bad);font-style:normal}
input,select,textarea{width:100%;min-width:0;border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:7px 10px;font-weight:400}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input.code{font:700 17px var(--fm);letter-spacing:.05em;text-transform:uppercase}
input[type=checkbox],input[type=radio]{width:auto}
.hint{font-size:12px;color:var(--muted);font-weight:400}.hint.bad{color:var(--bad)}.hint.ok{color:var(--ok)}
.tsel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

.tsel button b{display:block}.tsel button span{font-size:12px;color:var(--muted)}
.tsel button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.split{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;align-items:start}
.tool{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.tool input[type=search],.tool input[type=text]{flex:1 1 200px;max-width:320px}
.tool select,.tool input[type=date]{width:auto;flex:0 0 auto;max-width:200px}
.zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.zone{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px;min-width:0}
.zone h4{display:flex;align-items:center;gap:8px;font:700 14px var(--fm);margin-bottom:8px}
.slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.yard-scroll{overflow:auto;max-width:100%;max-height:78vh;border:1px solid var(--line);border-radius:10px;background:var(--surface2);overscroll-behavior:contain}
.yards{display:flex;align-items:flex-start;gap:12px;padding:10px;width:max-content;min-width:100%}
.yard{width:680px;flex:none;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px}
.yard-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.yard-columns{display:grid;grid-template-columns:repeat(4,160px);gap:8px}
.yard-col{min-width:0;border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--surface2)}
.yard-col h5{font:700 12px var(--fm);text-align:center;margin:0 0 6px}
.yard-slots{display:flex;flex-direction:column;gap:4px}
.yard-slots .slot{min-height:34px;flex-direction:row;gap:5px;align-items:center;justify-content:center;font-size:10px;padding:3px}
.yard-slots .slot span{font:600 10px var(--fm)}
.yard-slots .slot b{font-size:10px}
.slot-picker-list{display:flex;flex-direction:column;gap:6px;max-height:42vh;overflow:auto;margin-top:8px}
.slot-picker-list button{display:flex;align-items:center;gap:10px;text-align:left;padding:9px;border:1px solid var(--line);background:var(--surface2);border-radius:8px}
.report-special{display:flex;flex-wrap:wrap;gap:7px}

.slot{border:1px solid var(--line);background:var(--surface2);border-radius:6px;padding:3px 2px;min-height:48px;text-align:center;cursor:pointer;font-size:10px;color:var(--muted);display:flex;flex-direction:column;justify-content:center;min-width:0;overflow:hidden}
.slot b{font:700 11.5px/1.1 var(--fm);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot.s-wait{background:var(--wait-soft);border-color:var(--wait)}.slot.s-ok{background:var(--ok-soft);border-color:var(--ok)}.slot.s-new{background:var(--new-soft);border-color:var(--new)}
.slot.s-old{background:var(--accent-soft);border-color:var(--accent)}
.slot.late{box-shadow:inset 0 0 0 2px var(--bad)}
.slot.free:hover{border-color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-bottom:12px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(80px,140px) minmax(0,1fr) 40px;gap:8px;align-items:center;font-size:13px}
.bar .tr{height:9px;background:var(--surface2);border-radius:5px;overflow:hidden;border:1px solid var(--line)}.bar .tr i{display:block;height:100%;background:var(--accent)}
.bar>span:last-child{text-align:right;font:600 13px var(--fm)}
.li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:0}
.li .r{margin-left:auto;font:700 13px var(--fm);white-space:nowrap}

<script>
(function(){
'use strict';
/* ===== Tiện ích ===== */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
const DAY=864e5;
const normKey=s=>String(s==null?'':s).toUpperCase().replace(/[^A-Z0-9]/g,'');
const sod=d=>{d=new Date(d);d.setHours(0,0,0,0);return d};
const fD=iso=>{if(!iso)return '—';const d=new Date(iso);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()};
const hasT=iso=>{const d=new Date(iso);return d.getHours()||d.getMinutes()};
const fDT=iso=>!iso?'—':fD(iso)+(hasT(iso)?' '+pad(new Date(iso).getHours())+':'+pad(new Date(iso).getMinutes()):'');
const toIn=d=>{d=new Date(d);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes())};
const dKey=d=>{d=new Date(d);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const fromDKey=k=>{const p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2])};
const norm=s=>String(s==null?'':s).trim();

/* ===== Cấu hình mặc định (theo sheet danh_muc của bạn) ===== */
const YARD_COLS=['T','TLD','PLD','P'];
const ZONE_IDS=[1,2,3,4,5].flatMap(n=>YARD_COLS.map(x=>n+x));
const defCfg=()=>({org:{name:'Bãi xe VinFast'},
  models:['VF 3','VF 5','VF e34','VF 6','VF 7','VF 8','VF 9','Limo Green','Minio','EC Van','MPV7','Herio'],
  depots:['GSM','RTO','Khác'],depts:['Điều phối','Cố vấn','Kỹ thuật','GĐ','Khác','RTO'],
  inStates:['Chờ sửa chữa','Chờ giao GSM'],outStates:['Về xưởng sửa chữa','Giao GSM','Khác'],newOutStates:['Giao GSM','Về xưởng sửa chữa','Khác'],
  zones:ZONE_IDS.map(id=>({id,n:20})),specialEvents:[],warnDays:11});
const normalizeCfg=c=>{c=Object.assign(defCfg(),c||{});c.zones=Array.isArray(c.zones)?c.zones:[];ZONE_IDS.forEach(id=>{if(!c.zones.some(z=>z.id===id))c.zones.push({id,n:20})});c.specialEvents=Array.isArray(c.specialEvents)?c.specialEvents.slice(0,5):[];return c;};

/* ===== Kho dữ liệu ===== */
/* ===== Kho dữ liệu Firebase Realtime Database =====
   Đọc đúng nhánh parking34_data/vehicles. Không nhập lại JSON/Excel,
   không ghi đè toàn bộ nhánh; mỗi thao tác chỉ cập nhật đúng một bản ghi. */
const RTDB_URL='https://myparking34-default-rtdb.firebaseio.com';
const RTDB_PATH='parking34_data/vehicles';
const excelDateToIso=x=>{
  if(x==null||x==='')return '';
  if(typeof x==='number'&&Number.isFinite(x)){
    const d=new Date(Date.UTC(1899,11,30)+Math.round(x*86400000));
    return isNaN(d)?'':d.toISOString();
  }
  const d=new Date(x);return isNaN(d)?'':d.toISOString();
};
const rtdbToVisit=(r,key)=>{
  r=r||{};const inAt=excelDateToIso(r.inDate),outAt=excelDateToIso(r.outDate);
  const kind=r.type==='new'?'new':'old';
  return {
    id:String(r.id!=null?r.id:key),kind,plate:r.plate||'',vin6:r.vin||'',model:r.model||'Chưa rõ',color:r.color||'',keys:r.keyCount==null?'':String(r.keyCount),
    depot:r.depot||'',slot:r.slot||'',open:(r.status||'in')==='in'&&!outAt,
    inAt,inBy:r.inPerson||'',inDept:r.dept||'',inState:r.inStatus||'',inNote:'',
    outAt,outBy:r.outPerson||'',outDept:r.outDept||'',outState:r.outStatus||'',outNote:r.outNote||'',note:r.notes||'',
    createdAt:'',updatedAt:'',src:'firebase-rtdb',_rtdbKey:String(key),_raw:r
  };
};
const visitToRtdbPatch=v=>({
  type:v.kind==='new'?'new':'old',plate:v.plate||'',vin:v.vin6||'',model:v.model||'',color:v.color||'',keyCount:v.keys==null?'':String(v.keys),
  dept:v.inDept||'',depot:v.depot||'',slot:v.slot||'',status:v.open?'in':'out',
  inDate:v.inAt||'',inPerson:v.inBy||'',inStatus:v.inState||'',
  outDate:v.outAt||'',outPerson:v.outBy||'',outDept:v.outDept||'',outStatus:v.outState||'',outNote:v.outNote||'',notes:v.note||v.outNote||v.inNote||''
});
const Store={db:null,root:null,mode:'init',openM:new Map(),closedM:new Map(),visits:new Map(),cfg:defCfg(),ready:{o:false,c:false,s:false},q:{},timer:null,recordsByKey:new Map(),
  async init(){
    try{
      if(!window.firebase||!firebase.database)throw new Error('Thiếu Firebase Realtime Database SDK');
      const cfg={apiKey:'',projectId:'myparking34',databaseURL:RTDB_URL};
      const app=firebase.apps.length?firebase.app():firebase.initializeApp(cfg);
      this.db=firebase.database(app);this.root=this.db.ref(RTDB_PATH);this.firebase=true;this.mode='cloud';
      setSync('Đang kết nối Firebase Realtime Database…','warn');
      this.timer=setTimeout(()=>{if(!this.ready.o)setSync('Chưa đọc được dữ liệu Firebase · kiểm tra Rules/quyền truy cập','warn')},10000);
      this.root.on('value',snap=>{
        const next=new Map(),open=new Map(),closed=new Map(),byKey=new Map();
        snap.forEach(child=>{
          const key=child.key,raw=child.val();if(!raw||typeof raw!=='object')return;
          const v=rtdbToVisit(raw,key);next.set(v.id,v);byKey.set(String(key),v.id);
          (v.open?open:closed).set(v.id,v);
        });
        this.visits=next;this.openM=open;this.closedM=closed;this.recordsByKey=byKey;
        this.ready={o:true,c:true,s:true};clearTimeout(this.timer);
        setSync('Đã kết nối Firebase · '+next.size+' xe · đồng bộ trực tiếp','ok');onData();
      },e=>{this.firebaseError=e;setSync('Lỗi Firebase: '+(e&&e.code||e&&e.message||'không rõ')+' · kiểm tra Database Rules','bad')});
    }catch(e){this.db=null;this.mode='local';this.firebaseError=e;
      try{const o=JSON.parse(localStorage.getItem('bx2_data')||'null');if(o){this.visits=new Map((o.v||[]).map(x=>[x.id,x]));if(o.c)this.cfg=Object.assign(defCfg(),o.c)}}catch(_e){}
      this.ready={o:true,c:true,s:true};setSync('CHƯA KẾT NỐI FIREBASE · '+(e.code||e.message||'kiểm tra cấu hình'),'warn');onData();
    }
  },
  saveLocal(){if(this.mode!=='local')return;try{localStorage.setItem('bx2_data',JSON.stringify({v:[...this.visits.values()],c:this.cfg}))}catch(e){}},
  async put(v){
    v.updatedAt=new Date().toISOString();
    if(this.mode==='local'){this.visits.set(v.id,v);this.saveLocal();onData();return;}
    try{
      let key=v._rtdbKey;
      if(!key){const ref=this.root.push();key=ref.key;v._rtdbKey=key;v.id=String(v.id||Date.now());await ref.set(Object.assign({},v._raw||{},visitToRtdbPatch(v),{id:Number(v.id)||v.id}));}
      else await this.root.child(String(key)).update(visitToRtdbPatch(v));
    }catch(e){toast('Không lưu được Firebase ('+(e.code||e.message||'lỗi')+')');throw e;}
  },
  async del(id){
    const v=this.visits.get(id);if(!v)return;
    if(this.mode==='local'){this.visits.delete(id);this.saveLocal();onData();return;}
    if(!v._rtdbKey){toast('Không xác định được khóa bản ghi Firebase; không xóa để tránh nhầm xe.');return;}
    try{await this.root.child(String(v._rtdbKey)).remove()}catch(e){toast('Không xóa được Firebase ('+(e.code||e.message||'lỗi')+')');throw e;}
  },
  putCfg(c){this.cfg=normalizeCfg(c);this.saveLocal();onData();toast('Danh mục được lưu trên thiết bị này; chưa ghi vào Firebase để tránh tạo nhánh dữ liệu ngoài JSON gốc.');return Promise.resolve()},
  async bulk(list,cfg,replace){
    // Không cho phép thao tác thay thế hàng loạt trên kho Firebase.
    if(this.mode==='cloud'){toast('Đã khóa nhập/thay thế hàng loạt để bảo vệ dữ liệu Firebase gốc.');return;}
    this.visits=new Map(list.map(v=>[v.id,v]));if(cfg)this.cfg=cfg;this.saveLocal();onData();
  }
};
const C=()=>Store.cfg;
const ALL=()=>[...Store.visits.values()];
const OPEN=()=>ALL().filter(v=>v.open);
const codeOf=v=>v.kind==='new'?v.vin6:v.plate;
const keyOf=v=>normKey(codeOf(v));
const findOpen=k=>k&&OPEN().find(v=>keyOf(v)===k&&k!=='KHONGBIENSO');
const lastOf=k=>k&&ALL().filter(v=>keyOf(v)===k).sort((a,b)=>(b.inAt||'')<(a.inAt||'')?-1:1)[0];
const idHtml=v=>v.kind==='new'?'<span class="vin">'+esc(v.vin6)+'</span>':'<span class="plate">'+esc(v.plate||'—')+'</span>';
const daysIn=v=>v.inAt?Math.round((sod(Date.now())-sod(v.inAt))/DAY):null;
const ageCls=n=>n==null?'':n>=C().warnDays?'bad':n>=Math.ceil(C().warnDays*0.6)?'wait':'ok';
const agePill=v=>{const n=daysIn(v);return n==null?'<span class="pill">Chưa rõ ngày</span>':'<span class="pill '+ageCls(n)+'">'+n+' ngày</span>'};
const stCls=s=>!s?'':/sửa/i.test(s)?'wait':/giao/i.test(s)?'ok':'';
const stPill=s=>s?'<span class="pill '+stCls(s)+'">'+esc(s)+'</span>':'<span class="muted">—</span>';
const kindPill=v=>v.kind==='new'?'<span class="pill new">Xe mới</span>':'<span class="pill">Xe cũ</span>';
const people=()=>[...new Set(ALL().flatMap(v=>[v.inBy,v.outBy]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'vi'));
const allSlots=()=>{const r=[];C().zones.forEach(z=>{for(let i=1;i<=z.n;i++)r.push({id:z.id+'-'+i,zone:z.id})});return r};
const slotOwner=()=>{const m={};OPEN().forEach(v=>{if(v.slot)m[v.slot]=v});return m};
const rememberPerson=(by,dept)=>{try{localStorage.setItem('bx2_last',JSON.stringify({by,dept}))}catch(e){}};
const lastPerson=()=>{try{return JSON.parse(localStorage.getItem('bx2_last')||'{}')}catch(e){return {}}};

/* ===== Khung giao diện ===== */
const ui={page:'dashboard',ton:{q:'',kind:'',model:'',state:'',depot:'',zone:'',warn:false,sort:'old'},
  log:{q:'',kind:'',model:'',dept:'',depot:'',status:'',by:'',range:'all',from:'',to:''},
  rep:{mode:'week',ref:dKey(new Date())},vao:{slot:'',pre:''},ra:{id:''},drawer:null};
const PAGES={};
let toastT=null,rafId=0;
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true},3500)}
function setSync(t,cls){const s=$('#sync');if(!s)return;s.className='sync '+(cls||'');$('#syncTxt').textContent=t}
function go(p){if(location.hash!=='#'+p)location.hash='#'+p;else route()}
function route(){const p=(location.hash||'').slice(1);ui.page=PAGES[p]?p:'dashboard';closeOv();
  $$('.nav').forEach(b=>b.setAttribute('aria-current',b.dataset.go===ui.page?'page':'false'));draw();window.scrollTo(0,0)}
function draw(){const pg=PAGES[ui.page];$('#view').innerHTML=pg.render();if(pg.after)pg.after()}
function onData(){cancelAnimationFrame(rafId);rafId=requestAnimationFrame(()=>{
  $('#cntTon').textContent=OPEN().length;$('#cntLog').textContent=Store.visits.size;$('#orgName').textContent=C().org.name||'Bãi xe VinFast';
  const pg=PAGES[ui.page];if(!pg)return;
  const ae=document.activeElement,typing=ae&&ae.closest&&ae.closest('#view')&&/INPUT|SELECT|TEXTAREA/.test(ae.tagName);
  if(pg.live)pg.live();else if(!typing)draw();else if(pg.part)pg.part();
  if(ui.drawer)refreshDrawer();
})}
function openOv(html,o){o=o||{};$('#ovRoot').innerHTML='<div class="ov'+(o.center?' center':'')+'" data-act="ovbg"><div class="'+(o.center?'modal'+(o.lg?' lg':''):'drawer')+'" role="dialog" aria-modal="true">'+html+'</div></div>';const f=$('#ovRoot [autofocus]');if(f)f.focus()}
function closeOv(){$('#ovRoot').innerHTML='';ui.drawer=null}
function ask(title,msg,ok){return new Promise(res=>{openOv('<div class="mh"><h2>'+esc(title)+'</h2></div><p style="margin:0">'+esc(msg)+'</p><div class="mf"><button class="btn" data-act="cfNo">Hủy</button><button class="btn bad" data-act="cfYes">'+esc(ok||'Xóa')+'</button></div>',{center:true});window.__cf=v=>{window.__cf=null;$('#ovRoot').innerHTML='';res(v)}})}
const opts=(arr,cur,ph)=>(ph!=null?'<option value="">'+esc(ph)+'</option>':'')+arr.map(x=>{const v=Array.isArray(x)?x[0]:x,l=Array.isArray(x)?x[1]:x;return '<option value="'+esc(v)+'"'+(v===cur?' selected':'')+'>'+esc(l)+'</option>'}).join('');
const seg=(items,cur,act)=>'<div class="seg">'+items.map(i=>'<button data-act="'+act+'" data-v="'+i[0]+'" aria-pressed="'+(cur===i[0])+'">'+i[1]+'</button>').join('')+'</div>';
const head=(t,sub,right)=>'<div class="ph"><h1>'+t+(sub?'<span class="sub">'+sub+'</span>':'')+'</h1><div class="row">'+(right||'')+'</div></div>';
const countBy=(arr,fn)=>{const m={};arr.forEach(x=>{const k=fn(x)||'(chưa ghi)';m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])};

function chart14(){
  const E=events(),days=[];for(let i=13;i>=0;i--){const d=sod(Date.now());d.setDate(d.getDate()-i);days.push(d)}
  const data=days.map(d=>{const k=dKey(d);return [d,E.filter(e=>e.t==='in'&&dKey(e.at)===k).length,E.filter(e=>e.t==='out'&&dKey(e.at)===k).length]});
  const mx=Math.max(4,...data.map(x=>Math.max(x[1],x[2]))),top=Math.ceil(mx/4)*4,W=620,H=220,L=32,B=26,T=8,pw=(W-L-6)/14,ph=H-B-T;
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Lượt xe vào và ra 14 ngày gần nhất">';
  for(let i=0;i<=4;i++){const y=T+ph-ph*i/4;s+='<line x1="'+L+'" x2="'+(W-4)+'" y1="'+y+'" y2="'+y+'" style="stroke:var(--line)"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+(top*i/4)+'</text>'}
  data.forEach((x,i)=>{const cx=L+pw*i+pw/2,bw=Math.min(11,pw/2-3),h1=ph*x[1]/top,h2=ph*x[2]/top;
    s+='<rect x="'+(cx-bw-1)+'" y="'+(T+ph-h1)+'" width="'+bw+'" height="'+h1+'" rx="2" style="fill:var(--accent)"><title>'+fD(x[0])+': '+x[1]+' xe vào</title></rect><rect x="'+(cx+1)+'" y="'+(T+ph-h2)+'" width="'+bw+'" height="'+h2+'" rx="2" style="fill:var(--wait)"><title>'+fD(x[0])+': '+x[2]+' xe ra</title></rect>';
    if(i%2===1)s+='<text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle">'+pad(x[0].getDate())+'/'+pad(x[0].getMonth()+1)+'</text>'});
  return s+'</svg>';
}
function ageBuckets(L){const w=C().warnDays,b=[['0–3 ngày',0],['4–7 ngày',0],['8–'+(w-1)+' ngày',0],[w+'–'+(w*2)+' ngày',0],['Trên '+(w*2)+' ngày',0],['Chưa rõ ngày vào',0]];
  L.forEach(v=>{const n=daysIn(v);b[n==null?5:n<=3?0:n<=7?1:n<w?2:n<=w*2?3:4][1]++});return b}

function tonList(){
  const f=ui.ton,q=f.q.toLowerCase().trim(),k=normKey(f.q),w=C().warnDays;
  let L=OPEN().filter(v=>(!f.kind||v.kind===f.kind)&&(!f.model||v.model===f.model)&&(!f.state||(v.kind==='new'?'Xe mới':v.inState)===f.state)&&(!f.depot||v.depot===f.depot)&&(!f.zone||(v.slot||'').split('-')[0]===f.zone)&&
    (!f.warn||(daysIn(v)!=null&&daysIn(v)>=w))&&(f.today!=='in'||(v.inAt&&dKey(v.inAt)===dKey(new Date())))&&
    (!q||(k&&keyOf(v).includes(k))||[v.model,v.inBy,v.note,v.slot,v.inDept].join(' ').toLowerCase().includes(q)));
  const n=v=>daysIn(v);
  L.sort(f.sort==='new'?(a,b)=>(b.inAt||'')<(a.inAt||'')?-1:1:f.sort==='code'?(a,b)=>codeOf(a).localeCompare(codeOf(b)):(a,b)=>(n(b)==null?-1:n(b))-(n(a)==null?-1:n(a)));
  return L;
}

function raResults(){

function logRange(){const f=ui.log,n=sod(Date.now());

    case 'saveSpecial':saveSpecial();break;
    case 'delSpecial':deleteSpecial(+el.dataset.i);break;
    case 'exportReportPng':exportReportPng();break;
    case 'vaoKind':PAGES.vao.kind=v;applyKind();break;
    case 'vaoReset':draw();break;case 'vaoSubmit':vaoSubmit();break;
    case 'pickRa':ui.ra.id=id;$('#raForm').innerHTML=raForm();break;
    case 'raChange':ui.ra.id='';$('#raForm').innerHTML=raForm();break;case 'raSubmit':raSubmit();break;
    case 'exTon':exCSV('xe-ton-bai',tonList());break;
    case 'exLog':exCSV('nhat-ky-bai-xe',logRows());break;
    case 'exRep':{const r=repRange();exCSV('bao-cao-bai-xe',ALL().filter(x=>inR(x.inAt,r)||inR(x.outAt,r)));break}
    case 'exXlsx':exXlsx();break;
    case 'exBackup':{const t=JSON.stringify({app:'bai-xe-vinfast-v2',exportedAt:new Date().toISOString(),cfg:C(),visits:ALL()});saveFile('sao-luu-bai-xe-'+stamp()+'.json',t,t);break}
    case 'copyFb':{const t=$('#fb_txt');t.select();try{await navigator.clipboard.writeText(t.value);toast('Đã sao chép')}catch(x){document.execCommand&&document.execCommand('copy');toast('Đã chọn sẵn nội dung, bấm Ctrl+C để sao chép')}break}
    case 'logRange':ui.log.range=v;ui.log.from=ui.log.to='';draw();break;
    case 'repMode':ui.rep.mode=v;draw();break;
    case 'editV':ui.drawer={id,edit:true};$('#ovRoot .drawer').innerHTML=editHtml(Store.visits.get(id));break;
    case 'editCancel':ui.drawer={id};$('#ovRoot .drawer').innerHTML=drawerHtml(id);break;
    case 'editSave':editSave(id);break;
    case 'slotM':slotModal(id);break;
    case 'slotCancel':showV(id);break;
    case 'slotSave':{const x=Store.visits.get(id),s=$('#sl_slot').value;if(x){if(s&&slotOwner()[s]&&slotOwner()[s].id!==id){toast('Ô '+s+' đã có xe');break}x.slot=s;Store.put(x);toast('Đã chuyển ô')}showV(id);break}
    case 'delV':delV(id);break;
    case 'orgSave':{const c=JSON.parse(JSON.stringify(C()));c.org.name=norm($('#o_name').value)||'Bãi xe VinFast';c.warnDays=Math.max(1,parseInt($('#o_warn').value,10)||11);Store.putCfg(c);toast('Đã lưu');break}
    case 'zonesSave':{const L=$('#z_text').value.split('\n').map(s=>s.trim()).filter(Boolean),out=[],seen=new Set();let bad='';
      for(const ln of L){const p=ln.split('|').map(s=>s.trim()),zid=(p[0]||'').toUpperCase(),n=parseInt(p[1],10);if(!/^[A-Z0-9]{1,6}$/.test(zid)){bad='Mã khu "'+(p[0]||'')+'" chỉ gồm chữ cái hoặc số, tối đa 6 ký tự.';break}if(seen.has(zid)){bad='Mã khu '+zid+' bị trùng.';break}seen.add(zid);if(!(n>=1&&n<=300)){bad='Số ô của khu '+zid+' phải từ 1 đến 300.';break}out.push({id:zid,n})}
      if(!bad&&!out.length)bad='Cần ít nhất một khu bãi.';$('#z_err').textContent=bad;if(!bad){const c=JSON.parse(JSON.stringify(C()));c.zones=out;Store.putCfg(c);toast('Đã lưu khu bãi')}break}
    case 'lstAdd':{const k=el.dataset.k,val=norm($('#ls_'+k).value);if(!val)break;const c=JSON.parse(JSON.stringify(C()));if((c[k]||[]).includes(val)){toast('Mục này đã có');break}c[k]=(c[k]||[]).concat(val);Store.putCfg(c);break}
    case 'lstDel':{const k=el.dataset.k,c=JSON.parse(JSON.stringify(C()));c[k]=c[k].filter((_,i)=>i!==+el.dataset.i);Store.putCfg(c);break}
    case 'impClear':ui.imp=null;draw();break;
    case 'impCommit':{toast('Đã tắt nhập Excel/nhập hàng loạt. Dữ liệu xe được đọc trực tiếp từ Firebase Realtime Database.');ui.imp=null;go('dulieu');break} /* protected: no Excel import */
    case 'impCommit_legacy_disabled':{const p=ui.imp;if(!p)break;const mode=($('input[name=imp_mode]:checked')||{}).value||'add',replace=mode==='replace';
      if(mode==='dates'){const ok=await ask('Đối chiếu ngày vào từ Excel?','Chỉ cập nhật trường Ngày vào cho xe khớp duy nhất theo biển số/VIN và trạng thái lượt. Không xóa hoặc thay các trường khác. Các dòng Excel không có ngày sẽ được bỏ qua.','Đối chiếu ngày');if(!ok)break;let updated=0,unchanged=0,missing=0,ambiguous=0;for(const src of p.V){if(!src.inAt){missing++;continue}const k=keyOf(src);if(!k||k==='KHONGBIENSO')continue;let cand=ALL().filter(x=>keyOf(x)===k&&x.open===src.open);if(!src.open&&src.outAt)cand=cand.filter(x=>x.outAt&&dKey(x.outAt)===dKey(src.outAt));if(src.open)cand=cand.filter(x=>x.open);if(cand.length!==1){if(cand.length>1)ambiguous++;else unchanged++;continue}const target=cand[0];if(dKey(target.inAt||'')===dKey(src.inAt)){unchanged++;continue}target.inAt=src.inAt;await Store.put(target);updated++}ui.imp=null;toast('Đã cập nhật ngày vào '+updated+' xe · thiếu ngày '+missing+' · cần đối chiếu '+ambiguous);go('dulieu');break}
      let list=p.V;if(replace){const ok=await ask('Thay toàn bộ dữ liệu?','Mọi xe và nhật ký hiện có sẽ bị xóa và thay bằng dữ liệu từ file.','Thay thế');if(!ok){go('dulieu');break}}
      else{const openK=new Set(OPEN().map(keyOf)),have=new Set(ALL().map(x=>keyOf(x)+'|'+x.inAt+'|'+x.outAt));list=p.V.filter(x=>!(x.open&&openK.has(keyOf(x))&&keyOf(x)!=='KHONGBIENSO')&&!have.has(keyOf(x)+'|'+x.inAt+'|'+x.outAt))}
      toast('Đang nhập '+list.length+' lượt xe…');await Store.bulk(list,mergeCfg(p.add,p.zones),replace);ui.imp=null;toast('Đã nhập '+list.length+' lượt xe');go('ton');break}
    case 'clearAll':{toast('Đã khóa xóa toàn bộ trên Firebase để bảo vệ dữ liệu gốc.');break} /* legacy clear disabled */
    case 'clearAll_legacy_disabled':{const ok=await ask('Xóa toàn bộ dữ liệu?','Mọi xe và nhật ký sẽ bị xóa vĩnh viễn. Nên tải file sao lưu trước.','Xóa tất cả');if(ok){await Store.bulk([],null,true);toast('Đã xóa, bãi đang trống');go('dashboard')}else go('dulieu');break}
  }
});
document.addEventListener('input',e=>{const t=e.target,id=t.id;
  if(id==='gs')gsearch();
  else if(id==='slot_q'){const q=normKey(t.value),ql=t.value.toLowerCase().trim(),box=$('#slotPickList');if(box){const L=OPEN().filter(v=>!ql||(q&&keyOf(v).includes(q))||[codeOf(v),v.model,v.inBy,v.slot].join(' ').toLowerCase().includes(ql)).slice(0,50),slot=$('#slot_q').closest('.ov').querySelector('[data-act="slotNew"]').dataset.slot;box.innerHTML=L.length?L.map(v=>'<button data-act="slotAssign" data-id="'+v.id+'" data-slot="'+esc(slot)+'">'+idHtml(v)+'<span>'+esc(v.model)+'</span><span class="muted small" style="margin-left:auto">'+(v.slot?'Đang ở '+esc(v.slot):'Chưa gán ô')+'</span></button>').join(''):'<div class="empty">Không tìm thấy xe đang ở bãi phù hợp.</div>'}}
  else if(id==='t_q'){ui.ton.q=t.value;PAGES.ton.part()}else if(id==='l_q'){ui.log.q=t.value;PAGES.nhatky.part()}
  else if(id==='v_vin'){t.value=t.value.toUpperCase().replace(/[^A-Z0-9]/g,'');lookupVao()}else if(id==='v_plate')lookupVao();
  else if(id==='r_q')$('#r_res').innerHTML=raResults();
  else if(id==='v_at'||id==='r_at')t.dataset.auto='0'});
document.addEventListener('change',async e=>{const t=e.target,id=t.id,val=t.value;
  const M={t_kind:['ton','kind'],t_model:['ton','model'],t_state:['ton','state'],t_depot:['ton','depot'],t_zone:['ton','zone'],t_sort:['ton','sort'],l_kind:['log','kind'],l_status:['log','status'],l_model:['log','model'],l_dept:['log','dept'],l_depot:['log','depot'],l_by:['log','by']};
  if(M[id]){ui[M[id][0]][M[id][1]]=val;PAGES[ui.page].part();return}
  if(id==='t_warn'){ui.ton.warn=t.checked;PAGES.ton.part();return}
  if(id==='l_from'||id==='l_to'){ui.log[id==='l_from'?'from':'to']=val;draw();return}
  if(id==='p_ref'){ui.rep.ref=val||dKey(new Date());draw();return}
  if(t.dataset.chg==='state'){const x=Store.visits.get(t.dataset.id);if(x&&x.inState!==val){x.inState=val;Store.put(x);toast('Đã đổi tình trạng '+codeOf(x))}return}
  if(id==='v_slot'){return}
  if(id==='imp_file'&&t.files&&t.files[0]){const msg=$('#imp_msg');
    if(!window.XLSX){msg.className='hint bad';msg.textContent='Chưa tải được thư viện đọc Excel. Kiểm tra mạng rồi thử lại.';return}
    msg.className='hint';msg.textContent='Đang đọc file…';
    const fr=new FileReader();fr.onload=()=>{try{const wb=XLSX.read(fr.result,{type:'array'}),p=parseWb(wb);if(p.err){msg.className='hint bad';msg.textContent=p.err;return}ui.imp=p;draw()}catch(x){msg.className='hint bad';msg.textContent='Không đọc được file này ('+(x&&x.message||'lỗi')+').'}};fr.readAsArrayBuffer(t.files[0]);return}
  if(id==='rs_file'&&t.files&&t.files[0]){const fr=new FileReader();fr.onload=async()=>{try{const o=JSON.parse(fr.result);if(!o||!Array.isArray(o.visits))throw 0;
    const ok=await ask('Khôi phục dữ liệu?','Dữ liệu hiện tại sẽ được thay bằng '+o.visits.length+' lượt xe trong file.','Khôi phục');if(ok){toast('Đã khóa khôi phục hàng loạt trên Firebase để bảo vệ dữ liệu gốc.');}else go('dulieu')}catch(x){toast('File không đúng định dạng sao lưu.')}};fr.readAsText(t.files[0]);t.value=''}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#ovRoot').innerHTML)closeOv();$('#gres').hidden=true}
  if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){e.preventDefault();$('#gs').focus()}
  if(e.key==='Enter'&&e.target.id==='gs'){const b=$('#gres button');if(b)b.click()}
  if(e.key==='Enter'&&e.target.id&&e.target.id.indexOf('ls_')===0){e.preventDefault();e.target.parentNode.querySelector('[data-act="lstAdd"]').click()}
});
window.addEventListener('hashchange',route);
window.__bx={Store,parseWb,ALL,OPEN};
route();Store.init();
})();

</script>
